[project]
name = "verbamind"
version = "0.1.0"
description = "AI-assisted counseling session documentation — offline Windows desktop app"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["verbamind*"]

[project.scripts]
verbamind = "verbamind.main:main"
verbamind-backend = "verbamind.backend.main:main"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]  # line too long — cosmetic

[tool.ruff.lint.per-file-ignores]
"verbamind/gui/widgets/status_led.py" = ["N802"]  # Qt override requires paintEvent
"verbamind/security/key_manager.py" = ["N801"]  # Windows API struct _DATA_BLOB

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["verbamind"]

[tool.coverage.report]
fail_under = 80
