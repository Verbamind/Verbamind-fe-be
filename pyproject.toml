[project]
name = "verbamind"
version = "0.1.0"
description = "AI-assisted counseling session documentation — offline Windows desktop app"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}

[project.scripts]
verbamind = "verbamind.main:main"
verbamind-backend = "verbamind.backend.main:main"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["verbamind"]

[tool.coverage.report]
fail_under = 80
